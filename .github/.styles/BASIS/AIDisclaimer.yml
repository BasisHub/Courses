extends: existence
message: "Remove leftover AI text '%s'. This reads like pasted model output."
link: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
level: error
ignorecase: true
# Only unambiguous chatbot phrases stay at error level, because errors fail the
# required "runner / vale" check. Broader phrases that also occur in normal course
# text ("language model", "let me know") live in AIDisclaimerSoft.yml as warnings.
# NOTE: "AI" is an accepted term in the BASIS vocabulary, and Vale masks accepted
# terms from all checks, so "as an AI language model" cannot be matched here.
# The "language model" warning in AIDisclaimerSoft.yml still flags that case.
tokens:
  - 'as an? (?:large )?language model'
  - 'as of my last (?:knowledge )?(?:update|training)'
  - 'knowledge cut-?off'
  - 'my training data'
  - 'I cannot browse'
  - "I (?:don'?t|do not|cannot) have access to real-time"
  - "I(?:'m| am) unable to provide real-time"
