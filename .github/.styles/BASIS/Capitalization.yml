extends: substitution
message: "Use '%s' instead of '%s'."
level: warning
ignorecase: true
action:
  name: replace
# The lookbehind is the set {#, /, -} (hyphen last), not a character range.
# BASIS terms (BBj, DWC, ...) get their casing from Vale.Terms via accept.txt.
swap:
  '(?<![#/-])webforj(?![-/])': webforJ
  '(?<![#/-])startforj(?![-/])': startforJ
  '(?<![#/-])craftforj(?![-/])': craftforJ