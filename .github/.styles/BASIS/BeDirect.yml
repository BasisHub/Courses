extends: existence
message: "Avoid using '%s'. Focus more on explicitly giving details about the feature."
ignorecase: true
level: warning
# This style is for avoiding the following:
# - enhance "x"
# - ensure "x"
# - crucial for "x"
# - optimize "x"
# - "x" user experience
# - improve (for performance)
# Vale concatenates the raw items into one regex and adds no word boundaries,
# so each alternative carries its own \b and starts with "|" after the first.
raw:
  - '\b(?:(?:enhanc|ensur|optimiz)(?:e|ed|es|ing)|crucial for) (?:the user |the |user )?\w+(?: and \w+)?\b'
  - '|\bimprov(?:e|ed|es|ing) (?:the )?(?:performance|scalability)\b'
  - '|\b\w+ user experience\b'