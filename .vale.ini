StylesPath = .github/.styles
Vocab = BASIS
MinAlertLevel = suggestion
Packages = Google

[formats]
mdx = md

[docs/docs/**/*.{md,mdx}]
BasedOnStyles = Google, BASIS
Google.Semicolons = NO
Google.Passive = NO
Google.Will = NO
Google.Parens = NO
Google.Latin = NO
BlockIgnores = "{#.*?}"
TokenIgnores = (\{/\*.*?\*/\}), <(?:span|img)[^>]*>
