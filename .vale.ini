# Adapted from webforj/webforj-documentation .vale.ini (MIT, (c) 2022 webforJ; see LICENSES/webforJ-MIT.txt).
StylesPath = .github/.styles
Vocab = BASIS
MinAlertLevel = suggestion
# No "Packages" line: the Google style is vendored in .github/.styles/Google, so a
# local "vale sync" cannot replace it with a different release than CI uses.

[formats]
mdx = md

[docs/docs/**/*.{md,mdx}]
# The built-in Vale style enforces the BASIS vocabulary: Vale.Terms (accept.txt casing)
# and Vale.Avoid (reject.txt). Spelling stays off until the vocabulary is complete.
BasedOnStyles = Vale, Google, BASIS
Vale.Spelling = NO
Google.Semicolons = NO
Google.Passive = NO
Google.Will = NO
Google.Parens = NO
Google.Latin = NO
BlockIgnores = "{#.*?}"
TokenIgnores = (\{/\*.*?\*/\}), <(?:span|img)[^>]*>, (/docs/[\w/-]+)
